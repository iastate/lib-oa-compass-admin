<!-- src/app/components/settings/settings.component.html -->

<mat-card class="settings-card">
  <mat-card-title class="settings-title-row">
    <h1>{{ 'oa.settings.title' | translate }}</h1>
    <span class="settings-title-spacer"></span>
  </mat-card-title>

  <mat-card-content>

    <!-- Loading state -->
    <div *ngIf="loading" class="settings-loading" role="status" aria-live="polite" aria-atomic="true">
      <mat-progress-bar mode="indeterminate" [attr.aria-label]="'oa.settings.loading' | translate"></mat-progress-bar>
    </div>

    <form
      class="settings-form"
      *ngIf="!loading">

      <!-- Display options (per-user) -->
      <section class="settings-section">
        <h2 class="settings-section__title">
          {{ 'oa.settings.displayOptionsTitle' | translate }}
        </h2>
        <p class="settings-section__help">
          {{ 'oa.settings.displayOptionsHelp' | translate }}
        </p>

        <mat-checkbox
          [(ngModel)]="settings.showDebugPanel"
          name="showDebugPanel"
          (change)="toggleDebug()">
          {{ 'oa.settings.showDebugPanelLabel' | translate }}
        </mat-checkbox>
      </section>

      <!-- Actions -->
      <div class="oa-footer-actions">
        <button
          mat-flat-button
          type="button"
          [disabled]="saving"
          (click)="onCancel()">
          {{ 'oa.actions.cancel' | translate }}
        </button>

        <button
          mat-flat-button
          color="primary"
          type="button"
          [disabled]="saving"
          (click)="onSave()">
          {{ 'oa.actions.save' | translate }}
        </button>
      </div>

      <!-- Messages -->
      <div class="settings-messages">
        <span *ngIf="saved" class="settings-success" role="status" aria-live="polite" aria-atomic="true">
          {{ 'oa.settings.savedMessage' | translate }}
        </span>
        <span *ngIf="error" class="settings-error" role="alert" aria-atomic="true">
          {{ error }}
        </span>
      </div>
    </form>

  </mat-card-content>
</mat-card>
