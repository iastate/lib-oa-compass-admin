name: Bug report
description: Report reproducible public Cloud App behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, Alma/OpenAthens user data, tenant identifiers, or nonpublic service details.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened using synthetic or redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed all credentials, tokens, personal data, tenant identifiers, and nonpublic service information.
          required: true
